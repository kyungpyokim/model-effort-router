name: Tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      MER_CORE_PATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.9"
      - run: python -m unittest discover -s tests
      - run: python -m pip install ruff==0.15.20
      - run: ruff check .
      - run: ruff format --check .
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: plugins/opencode-model-effort-router/package-lock.json
      - run: npm ci
        working-directory: plugins/opencode-model-effort-router
      - run: npm run typecheck
        working-directory: plugins/opencode-model-effort-router
      - run: npm run lint
        working-directory: plugins/opencode-model-effort-router
      - run: npx prettier --check src
        working-directory: plugins/opencode-model-effort-router
